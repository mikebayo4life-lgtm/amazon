<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./Multimedia/images/amazon.png">
    <link rel="stylesheet" href="./css/sign.css">
    <title>Amazon Sign-in</title>
</head>

<body>
    <div class="ama">
        <div class="sign">
            <div class="container">
                <div class="img">
                    <img src="./Multimedia/images/logo-1.svg" width="130px" alt="">
                </div>
                <div class="signin-container">
                    <div class="center">
                        <h1>Sign in or create account</h1>
                        <label for="">Enter mobile number or email</label>
                        <input type="Email">
                    </div>
                    <div class="bnt">
                        <button class="btn">Continue</button>
                    </div>
                    <div class="link">
                        <p>By continuing, you agree to Amazon's <a href="">Conditions of Use</a> and <a href="">Privacy
                                Notice</a>.
                        </p>
                    </div>
                    <div class="help">
                        <a href="">Need help?</a>
                    </div>
                    <div class="section">
                        <h1>Buying for work?</h1>
                        <a href="">Create a free business account</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="footerline"></div>
        <div class="footer">
            <a href="">Conditions of Use </a>
            <a href="">Privacy Notice </a>
            <a href="">Help</a>
            <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
        </div>
    </div>
</body>

</html>
